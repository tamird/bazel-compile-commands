# CI-only native validation of the supplier pipe regression.
name: Check Bazel info pipe handling

on:
  workflow_dispatch:
    inputs:
      style_only:
        description: Run only the canonical formatter
        type: boolean
        default: false
      native_windows:
        description: Qualify only the Windows owning target
        type: boolean
        default: false
      analysis_only:
        description: Analyze the Windows owning target without building
        type: boolean
        default: true

      portable_product:
        description: Existing release product to qualify
        type: choice
        options: [none, linux-amd64, macos]
        default: none
      product_analysis_only:
        description: Verify producer actions before building
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.style_only && !inputs.native_windows && inputs.portable_product == 'none' }}
    name: Native Linux owning tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Bazel cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel_build_cache
          key: ${{ runner.os }}-bazel-test-${{ hashFiles('MODULE.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-test-
      - name: Run bazel test
        run: >
          bazel test --config=gnu --config=ci
          --disk_cache=~/.cache/bazel_build_cache --test_timeout=30
          --ui_event_filters= --test_output=errors //tests:self_test
      - name: Cache cleanup
        if: always()
        run: ./tools/disk-cache-collect-garbage ~/.cache/bazel_build_cache
      - name: Preserve owning test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-owning-test-${{ github.run_id }}
          path: |
            bazel-testlogs/tests/self_test/test.log
            bazel-testlogs/tests/self_test/test.xml
          if-no-files-found: warn

  format_check:
    if: ${{ (!inputs.native_windows || inputs.analysis_only) && inputs.portable_product == 'none' }}
    name: Canonical style check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "15.0.6"
      - name: clang-format --version
        run: clang-format --version
      - name: Style check
        run: ./tools/clang-format --dry-run -Werror

  windows:
    name: Native Windows owning test
    if: ${{ inputs.native_windows && inputs.portable_product == 'none' }}
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Bazel cache
        id: windows_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel_build_cache
          key: ${{ runner.os }}-bazel-test-${{ hashFiles('MODULE.bazel') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-test-${{ hashFiles('MODULE.bazel') }}-
            ${{ runner.os }}-bazel-test-
      - name: Analyze owning target
        if: ${{ inputs.analysis_only }}
        run: >
          bazel test --config=cl --config=ci
          --disk_cache=~/.cache/bazel_build_cache --nobuild //tests:self_test
      - name: Run owning test
        if: ${{ !inputs.analysis_only }}
        run: >
          bazel test --config=cl --config=ci
          --disk_cache=~/.cache/bazel_build_cache --test_timeout=30
          --ui_event_filters= --test_output=errors //tests:self_test
      - name: Cache cleanup
        if: always()
        shell: bash
        run: ./tools/disk-cache-collect-garbage ~/.cache/bazel_build_cache
      - name: Preserve Bazel products
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel_build_cache
          key: ${{ steps.windows_cache.outputs.cache-primary-key }}
      - name: Preserve owning test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-owning-test-${{ github.run_id }}
          path: |
            bazel-testlogs/tests/self_test/test.log
            bazel-testlogs/tests/self_test/test.xml
          if-no-files-found: warn

  buildpkg:
    name: Qualify compatible release product
    if: ${{ inputs.portable_product != 'none' }}
    runs-on: ${{ inputs.portable_product == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Bazel cache
        id: product_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/bazel_build_cache
          key: ${{ runner.os }}-bazel-buildpkg-${{ hashFiles('MODULE.bazel') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-buildpkg-${{ hashFiles('MODULE.bazel') }}-
            ${{ runner.os }}-bazel-buildpkg-
            ${{ runner.os }}-bazel-test-
      - name: Analyze Linux producer
        if: ${{ inputs.portable_product == 'linux-amd64' && inputs.product_analysis_only }}
        run: >
          bazel aquery --config=gnu --config=ci --config=release
          --platforms=//:linux_x86_64
          --extra_toolchains=@musl_toolchains_hub//:all
          --output=text 'mnemonic("CppCompile", //bcc:bazel-compile-commands-binary)'
          > producer-actions.txt
      - name: Analyze macOS producer
        if: ${{ inputs.portable_product == 'macos' && inputs.product_analysis_only }}
        run: >
          bazel aquery --config=gnu --config=ci --config=release
          --platforms=//:apple-darwin-aarch64 --macos_minimum_os=15.5
          --output=text 'mnemonic("CppCompile", deps(//bcc:bazel-compile-commands-universal, 1))'
          > producer-actions.txt
      - name: Build Linux release product
        if: ${{ inputs.portable_product == 'linux-amd64' && !inputs.product_analysis_only }}
        run: >
          bazel run --config=gnu --config=ci --config=release
          --disk_cache=~/.cache/bazel_build_cache --platforms=//:linux_x86_64
          --extra_toolchains=@musl_toolchains_hub//:all
          //:copy_zip -- approved-324-linux-amd64.zip
      - name: Build macOS release product
        if: ${{ inputs.portable_product == 'macos' && !inputs.product_analysis_only }}
        run: >
          bazel run --config=gnu --config=ci --config=release
          --disk_cache=~/.cache/bazel_build_cache
          --platforms=//:apple-darwin-aarch64 --macos_minimum_os=15.5
          //:copy_zip -- approved-324-macos15.5-universal.zip
      - name: Verify source preserved
        if: always()
        run: |
          git diff --exit-code --quiet
          git diff --cached --exit-code --quiet
      - name: Preserve Bazel products
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/bazel_build_cache
          key: ${{ steps.product_cache.outputs.cache-primary-key }}
      - name: Preserve actual producer results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatible-${{ inputs.portable_product }}-${{ github.run_id }}
          path: |
            producer-actions.txt
            approved-324-*.zip
          if-no-files-found: warn
